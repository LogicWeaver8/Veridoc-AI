services:
  veridox:
    build: .
    image: veridox-ai:1.0.0
    container_name: veridox-ai
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      DATA_DIR: /app/data
    # Optional: copy .env.example to .env to configure providers and secrets.
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
